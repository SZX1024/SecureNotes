name: Deploy

# Deploying on a push to main is the whole of the GitHub binding: Cloudflare needs no repository access, only a token
# that can be revoked, and the deployment is reproducible from a commit.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — "Edit Cloudflare Workers" template, or a token with Workers Scripts:Edit plus
#                            D1:Edit and Workers R2 Storage:Edit
#   CLOUDFLARE_ACCOUNT_ID  — the account id from the Cloudflare dashboard
#
# Optional repository variable:
#   ALLOWED_ORIGINS        — the deployed origin, e.g. https://securenotes.<subdomain>.workers.dev. The worker checks
#                            the browser's Origin against it, so an empty value makes the deployed app refuse its own
#                            requests. Set it before the first deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A deployment is never cancelled half way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same gate as CI: nothing reaches production that has not passed it.
      - name: Version consistency, format, lint, typecheck, tests, acceptance
        run: pnpm check

      - name: Note whether Cloudflare credentials are configured
        id: credentials
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cloudflare credentials; checking only. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy."
          fi

      - name: Build the client
        if: steps.credentials.outputs.available == 'true'
        run: pnpm build

      # Migrations run before the code that expects them. They are additive by design (§5), so this is safe to repeat.
      - name: Apply database migrations
        if: steps.credentials.outputs.available == 'true'
        run: pnpm --filter @securenotes/worker exec wrangler d1 migrations apply securenotes-db --remote

      - name: Deploy the worker and the client
        if: steps.credentials.outputs.available == 'true'
        run: |
          # The values the deployment needs are passed here rather than kept in wrangler.toml, which stays a
          # development configuration: the same file runs the local stack, where the origins are localhost and
          # diagnostics are exposed. ENVIRONMENT=production also turns on the stricter security headers.
          if [ -n "${{ vars.ALLOWED_ORIGINS }}" ]; then
            pnpm --filter @securenotes/worker exec wrangler deploy \
              --var "ALLOWED_ORIGINS:${{ vars.ALLOWED_ORIGINS }}" \
              --var "ENVIRONMENT:production"
          else
            echo "::warning::ALLOWED_ORIGINS is not set; deploying with the development origins, which the deployed app will reject."
            pnpm --filter @securenotes/worker exec wrangler deploy --var "ENVIRONMENT:production"
          fi
