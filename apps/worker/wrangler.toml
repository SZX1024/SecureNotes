#:schema node_modules/wrangler/config-schema.json
name = "securenotes"
main = "src/index.ts"
# Pinned deliberately: never let a deploy pick up new runtime defaults silently.
# Keep this <= the newest date supported by the OLDEST runtime in the toolchain:
# @cloudflare/vitest-pool-workers pins miniflare 5.20260815.0-alpha (workerd
# 1.20260815.1), which rejects anything newer than 2026-08-22, so a newer date
# here makes the whole worker test suite fail to boot. Raise only with that pin.
compatibility_date = "2026-08-22"
workers_dev = true

[dev]
port = 8787

# These are the *development* values, and they are the ones `wrangler dev` uses.
# Deployment does not read them: `wrangler deploy --env production` takes
# everything from `[env.production]` below. Keeping the two apart is what stops a
# deploy from silently publishing localhost as the deployed origin — and stops the
# local stack from being configured for production.
[vars]
ENVIRONMENT = "development"
# Origins allowed to call the API. The browser talks to its own origin and Vite
# proxies /api to this worker, so in development the Vite origins must be listed
# explicitly: the worker sees the browser's Origin, not its own.
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

# Local development uses Miniflare's local D1/R2 emulation (.wrangler/state) and
# needs no Cloudflare account. Before the first `wrangler deploy`, replace the
# placeholder id below with the real id from `wrangler d1 create securenotes-db`.
[[d1_databases]]
binding = "DB"
database_name = "securenotes-db"
database_id = "72771b35-93b8-41c8-be3a-776a7a631418"
migrations_dir = "migrations"

# The built client is served from the same origin as the API (§14: same-origin
# only, no CORS). `run_worker_first` keeps /api/* in the worker even when a static
# file could match, so an asset can never shadow an endpoint.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "securenotes-attachments"

# Audit-log retention is exactly 30 days (requirements §5); the hourly sweep
# that enforces it is implemented in P2.
[triggers]
crons = ["17 * * * *"]

[observability]
enabled = true

# ---------------------------------------------------------------------------------------------------------------
# The deployed environment.
#
# `wrangler deploy --env production` (or `pnpm deploy`) uses this section and nothing above changes: the same worker
# name, the same database and bucket bindings, the same assets and the same cron trigger. `name` has to be repeated
# here on purpose — wrangler derives `securenotes-production` for an environment that does not state one, which would
# deploy a second worker under a second URL and leave the real one serving the previous version.
#
# The bindings are inherited; the variables are not, so every variable the deployment needs is written out here.
# ---------------------------------------------------------------------------------------------------------------
[env.production]
name = "securenotes"
workers_dev = true

[env.production.vars]
ENVIRONMENT = "production"
# Every origin the application is served from, and the only ones allowed to call the API. This is a security control
# rather than a convenience: it is what stops another site from driving the API with this browser's cookies. Adding a
# domain here is part of moving to it — a domain that is missing answers every request with 403 ORIGIN_REJECTED, which
# looks like a broken sign-in rather than a wrong setting.
#
# The workers.dev origin is kept alongside the custom domain so both keep working; drop it to leave exactly one.
ALLOWED_ORIGINS = "https://notes.szx10246.xyz,https://securenotes.szx10246.workers.dev"

# The bindings are repeated deliberately: wrangler does not inherit `d1_databases` or `r2_buckets` into an environment,
# and a deployment without them is a worker with no database — it would answer every request with a configuration error
# while the account and the notes sat untouched in D1. `wrangler deploy --env production --dry-run` warns about exactly
# this, so the mismatch is caught before a deployment rather than after one.
#
# The cost is that the database id is written twice and the two must agree.
[[env.production.d1_databases]]
binding = "DB"
database_name = "securenotes-db"
database_id = "72771b35-93b8-41c8-be3a-776a7a631418"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "securenotes-attachments"
