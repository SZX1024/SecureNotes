#:schema node_modules/wrangler/config-schema.json
name = "securenotes"
main = "src/index.ts"
# Pinned deliberately: never let a deploy pick up new runtime defaults silently.
# Keep this <= the newest date supported by the OLDEST runtime in the toolchain:
# @cloudflare/vitest-pool-workers pins miniflare 5.20260815.0-alpha (workerd
# 1.20260815.1), which rejects anything newer than 2026-08-22, so a newer date
# here makes the whole worker test suite fail to boot. Raise only with that pin.
compatibility_date = "2026-08-22"
workers_dev = true

[dev]
port = 8787

[vars]
ENVIRONMENT = "development"
# Origins allowed to call the API. The browser talks to its own origin and Vite
# proxies /api to this worker, so in development the Vite origins must be listed
# explicitly: the worker sees the browser's Origin, not its own.
# Production must list only the deployed origin, e.g. "https://notes.example.com".
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

# Local development uses Miniflare's local D1/R2 emulation (.wrangler/state) and
# needs no Cloudflare account. Before the first `wrangler deploy`, replace the
# placeholder id below with the real id from `wrangler d1 create securenotes-db`.
[[d1_databases]]
binding = "DB"
database_name = "securenotes-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# The built client is served from the same origin as the API (§14: same-origin
# only, no CORS). `run_worker_first` keeps /api/* in the worker even when a static
# file could match, so an asset can never shadow an endpoint.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "securenotes-attachments"

# Audit-log retention is exactly 30 days (requirements §5); the hourly sweep
# that enforces it is implemented in P2.
[triggers]
crons = ["17 * * * *"]

[observability]
enabled = true
